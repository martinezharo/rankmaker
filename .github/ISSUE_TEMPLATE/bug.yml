name: Report a bug
description: Something in RANKMAKER is broken or does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make RANKMAKER better. The more detail you share, the
        faster it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
      placeholder: When I finished a ranking early, the result page showed...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected to see...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: If you can, list the steps. A link to the template or ranking helps a lot.
      placeholder: |
        1. Open https://rankmaker.net/...
        2. Click on ...
        3. See ...
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15 / Safari, or Windows 11 / Firefox
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop any images here. A picture often explains it best.
    validations:
      required: false
