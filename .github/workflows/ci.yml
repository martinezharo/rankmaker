name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Correctness gate — the same checks CLAUDE.md relies on, now enforced in CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Coverage, not a plain run: vitest.config.ts sets floors on the
      # server-side code, so a change that quietly stops covering it fails
      # here instead of shipping.
      - run: pnpm test:coverage
      - run: pnpm build
      # Everything above this line tests `astro dev`; none of it executes the
      # bundle that actually gets deployed. This boots that bundle in workerd
      # and checks the bytes it serves — a build can compile clean and still
      # return "[object Object]" on every page (see wrangler.jsonc's note on
      # `nodejs_compat`).
      - run: pnpm test:smoke

  # Browser-level checks of the ranking and account flows — the parts of the
  # product that only exist once the engine, the DOM and ClientRouter are all
  # real. Runs against `astro dev`; the suite applies the D1 migrations to a
  # local miniflare database itself and seeds its own sessions, so it needs no
  # secrets and touches nothing outside the runner.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Deploy readiness — fails if prod D1 has un-applied migrations or is missing a
  # required secret. Needs a CLOUDFLARE_API_TOKEN repo secret; skips (with a
  # warning) until that's configured so it never blocks before you're ready.
  deploy-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migrations + secrets against production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy-readiness check. Add it under Settings → Secrets and variables → Actions to enable."
            exit 0
          fi
          pnpm run check:deploy

  # A shareable preview URL on every pull request.
  #
  # Cloudflare's own Git integration can post these, but only when its
  # dashboard settings happen to line up, and none of that state lives in the
  # repo — so previews turned up on some pull requests and not others. Doing
  # the upload here is what makes them arrive every time, and it survives
  # rebuilding the account or moving hosts, because the whole mechanism is this
  # job plus `preview_urls` in wrangler.jsonc.
  #
  # `versions upload` uploads; it does not deploy. Production carries on
  # serving the version it already had, and this one takes no traffic until
  # someone deploys it. It does carry the same bindings block as production
  # though — the real D1, R2 and KV — so the comment says so out loud.
  preview:
    # A build that cannot pass `verify` should not get a shareable URL.
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload a preview version and comment the URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          # Passed through the environment, never interpolated into the script
          # below: a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Pull requests from forks get no secrets, so there is nothing to
          # upload with and no write token to comment with. Say so and pass.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN (fork pull request, or the secret is unset) — skipping the preview upload."
            exit 0
          fi

          # stderr is folded in so the log holds the whole story, and the exit
          # status is taken from wrangler rather than from tee.
          set +e
          pnpm exec wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --tag "pr-${PR_NUMBER}-${GITHUB_SHA:0:7}" 2>&1 | tee upload.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            # A token that cannot upload Workers is a setup step nobody has
            # done yet, not a bad commit — so it warns and passes, exactly as
            # deploy-readiness does for its own missing token. Holding every
            # pull request red over an account setting would punish the wrong
            # thing. The API's own wording ("Authentication error") does not
            # say what to do about it, hence the spelled-out message.
            if grep -qE 'Authentication error|code: 10000' upload.log; then
              echo "::warning::No preview URL: CLOUDFLARE_API_TOKEN cannot upload Workers. Give it the \"Edit Cloudflare Workers\" permission template at https://dash.cloudflare.com/profile/api-tokens (a token scoped only for the read checks — D1 migrations, secret listing — is not enough), then re-run this job."
              exit 0
            fi
            # Anything else is a real failure and should be seen as one.
            exit "$status"
          fi

          # Prefer the alias URL: it is the same for the life of the pull
          # request, so the comment stays correct across pushes.
          url=$(sed -n 's/.*Version Preview Alias URL: *//p' upload.log | tail -1)
          if [ -z "$url" ]; then
            url=$(sed -n 's/.*Version Preview URL: *//p' upload.log | tail -1)
          fi
          if [ -z "$url" ]; then
            echo "::error::The version uploaded but wrangler printed no preview URL. Check that preview_urls is enabled and that the account has a workers.dev subdomain."
            exit 1
          fi

          marker='<!-- ci-preview-url -->'
          {
            printf '%s\n' "$marker"
            printf '### Preview\n\n'
            printf '%s\n\n' "$url"
            printf 'Built from `%s`. Uploaded, not deployed — production is untouched until this merges.\n\n' "${GITHUB_SHA:0:7}"
            printf '> [!WARNING]\n'
            printf '> The preview carries the same bindings as production: the real D1 database, R2 bucket and KV namespace. Anything created while testing it is written to live data.\n'
          } > comment.md

          # One comment per pull request, rewritten in place on each push.
          # `first` inside the filter would give one answer per page, so the
          # match is taken across the whole paginated stream instead.
          id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md >/dev/null
            echo "Updated comment ${id}: ${url}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@comment.md >/dev/null
            echo "Commented: ${url}"
          fi
