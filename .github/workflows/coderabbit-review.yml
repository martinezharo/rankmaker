# Ask CodeRabbit for a review on every pull request.
#
# CodeRabbit's free OSS plan only reviews automatically once a repository has
# 10+ stars ("This repository does not receive automatic reviews because it has
# fewer than 10 stars"). That is a plan gate, not a setting, so no
# `.coderabbit.yaml` key turns it back on — `reviews.auto_review.enabled` is
# already true by default and does not override it.
#
# The gate only blocks the *automatic* trigger; the `@coderabbitai review`
# command still works. So this posts that command for us, and the effect is the
# automatic review we wanted. Delete this workflow once the repo passes 10
# stars, or if the account moves to a paid plan.
name: CodeRabbit review

on:
  pull_request:
    # No `synchronize`: CodeRabbit reviews incrementally, and re-triggering on
    # every push would add one bot comment per push for little gain. Ask for a
    # re-review by commenting `@coderabbitai review` on the PR.
    types: [opened, reopened, ready_for_review]

# The default token would do, but this states the one permission needed rather
# than inheriting whatever the repository default happens to be.
permissions:
  pull-requests: write

jobs:
  request-review:
    # A draft is not ready to be reviewed; `ready_for_review` covers it later.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Comment the review command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr comment "$PR" --repo "$REPO" --body "@coderabbitai review"
